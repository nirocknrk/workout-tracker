<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Workout Tracker</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1c2530; --muted:#6b7684;
  --accent:#2563eb; --accent-dark:#1d4ed8; --line:#e3e8ee;
  --good:#15803d; --warn:#b45309; --danger:#dc2626;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;}
header.top{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line);
  padding:12px 16px; display:flex; align-items:center; justify-content:space-between;}
header.top h1{font-size:18px; margin:0; letter-spacing:.2px;}
nav.tabs{display:flex; gap:8px;}
nav.tabs button{border:1px solid var(--line); background:var(--bg); color:var(--ink);
  border-radius:999px; padding:8px 14px; font-size:14px; cursor:pointer;}
nav.tabs button.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
main{max-width:560px; margin:0 auto; padding:14px 14px 40px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:12px;}
.card h2{margin:0 0 4px; font-size:17px;}
.card h3{margin:14px 0 6px; font-size:15px;}
.sub{color:var(--muted); font-size:13px; margin:0 0 10px;}
.btn{display:inline-block; border:none; border-radius:12px; padding:13px 18px; font-size:16px;
  font-weight:700; cursor:pointer; background:var(--accent); color:#fff; width:100%; text-align:center;}
.btn:active{background:var(--accent-dark); transform:scale(.99);}
.btn.ghost{background:var(--bg); color:var(--ink); border:1px solid var(--line); font-weight:600;}
.btn.small{width:auto; padding:8px 12px; font-size:14px;}
.btn.danger{background:#fef2f2; color:var(--danger); border:1px solid #fecaca;}
.summary{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px; text-align:center;}
.stat .v{font-size:20px; font-weight:800;}
.stat .l{font-size:12px; color:var(--muted);}
.exrow{display:flex; align-items:center; gap:12px; padding:10px 4px; border-top:1px solid var(--line); cursor:pointer;}
.exrow:first-of-type{border-top:none;}
.exrow .icon{flex:0 0 40px; width:40px; height:40px; border-radius:10px; background:#eef2ff;
  display:flex; align-items:center; justify-content:center; color:var(--accent);}
.exrow .icon svg{width:28px; height:28px;}
.exrow .nm{flex:1;}
.exrow .nm .t{font-weight:600; font-size:15px;}
.exrow .nm .s{font-size:13px; color:var(--muted);}
.exrow .go{color:var(--muted); font-size:20px; padding:4px 8px;}
.setrow{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.setrow .n{flex:0 0 44px; font-weight:700; color:var(--muted); font-size:14px;}
.setrow input{flex:1; min-width:0; padding:11px 10px; font-size:16px; border:1px solid var(--line);
  border-radius:10px; background:#fbfcfe;}
.setrow input:focus{outline:2px solid var(--accent); border-color:var(--accent);}
.setrow .u{flex:0 0 64px; font-size:13px; color:var(--muted);}
.setrow .x{flex:0 0 34px; border:1px solid var(--line); background:var(--bg); border-radius:10px;
  font-size:16px; padding:8px 0; cursor:pointer; color:var(--danger);}
.logex{border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:12px; background:var(--card);}
.logex .head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.logex .head .icon{flex:0 0 36px; width:36px; height:36px; border-radius:9px; background:#eef2ff;
  display:flex; align-items:center; justify-content:center; color:var(--accent);}
.logex .head .icon svg{width:24px; height:24px;}
.logex .head .t{flex:1; font-weight:700;}
.logex .target{font-size:13px; color:var(--muted); margin:0 0 10px 46px;}
.guidebtn{border:1px solid var(--line); background:#f8fafc; border-radius:10px; padding:8px 12px;
  font-size:13px; cursor:pointer; color:var(--accent); font-weight:600; margin:0 0 10px 46px;}
.video{position:relative; width:100%; padding-bottom:56.25%; margin:10px 0; border-radius:12px; overflow:hidden; background:#000;}
.video iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
.attr{font-size:12px; color:var(--muted); margin:2px 0 10px;}
.attr a{color:var(--accent);}
.note{background:#f0f7ff; border-left:4px solid var(--accent); padding:10px 12px; border-radius:0 10px 10px 0;
  font-size:14px; margin:10px 0;}
ol.setup, ul.list{margin:6px 0 12px; padding-left:22px; font-size:14px;}
ol.setup li, ul.list li{margin-bottom:6px;}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.cols .do{background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:10px;}
.cols .dont{background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:10px;}
.cols h4{margin:0 0 6px; font-size:13px;}
.cols ul{margin:0; padding-left:18px; font-size:13px;}
.cols li{margin-bottom:4px;}
.tip{background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0;}
.tempo{font-size:14px; font-weight:600; margin:8px 0;}
.hist{border:1px solid var(--line); border-radius:var(--radius); background:var(--card); padding:12px; margin-bottom:10px;}
.hist .hd{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.hist .hd .d{font-weight:700;}
.hist .hd .w{font-size:13px; color:var(--muted);}
.hist .en{font-size:13px; color:var(--muted); margin:2px 0;}
.empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px;}
.backlink{display:inline-block; margin-bottom:10px; color:var(--accent); font-size:14px; cursor:pointer; font-weight:600;}
footer{max-width:560px; margin:0 auto; padding:0 14px 30px; color:var(--muted); font-size:12px; text-align:center;}
</style>
</head>
<body>
<header class="top">
  <h1>Workout Tracker</h1>
  <nav class="tabs">
    <button id="tab-program" class="active">Program</button>
    <button id="tab-history">History</button>
  </nav>
</header>
<main id="app"></main>
<footer>Your logs are stored privately in this browser (localStorage). No account, no server.</footer>

/* ============ PROGRAM ============ */
const DAYS = [
  {name:"Day 1 — Push", focus:"Chest · Shoulders · Triceps", items:[
    {id:"flatDbBench", sets:4, reps:"6-10"},
    {id:"inclineDbPress", sets:3, reps:"8-12"},
    {id:"standingOhp", sets:3, reps:"8-12"},
    {id:"lateralRaise", sets:3, reps:"12-15"},
    {id:"ohTricepsExt", sets:3, reps:"10-15"},
    {id:"hangingKneeRaise", sets:3, reps:"12-15"}
  ]},
  {name:"Day 2 — Pull + Legs", focus:"Back · Biceps · Legs", items:[
    {id:"oneArmRow", sets:4, reps:"8-12"},
    {id:"dbRdl", sets:3, reps:"8-12"},
    {id:"bulgarianSplitSquat", sets:3, reps:"8-12"},
    {id:"rearDeltFly", sets:3, reps:"12-15"},
    {id:"bicepCurl", sets:3, reps:"10-12"},
    {id:"hammerCurl", sets:2, reps:"10-12"},
    {id:"plank", sets:3, reps:"45-60"}
  ]},
  {name:"Day 3 — Shoulders + Arms", focus:"Delts · Arms · Core", items:[
    {id:"arnoldPress", sets:3, reps:"8-12"},
    {id:"closeGripPress", sets:3, reps:"10-12"},
    {id:"lateralRaise", sets:4, reps:"12-15"},
    {id:"frontRaise", sets:2, reps:"12"},
    {id:"hammerCurl", sets:3, reps:"10-12"},
    {id:"ohTricepsExt", sets:3, reps:"10-12"},
    {id:"proneYRaise", sets:2, reps:"12-15"},
    {id:"russianTwist", sets:3, reps:"15"}
  ]}
];
/* ============ STORAGE ============ */
const LS_KEY = "wtg-logs-v1";
function loadLogs(){ try{ const v = JSON.parse(localStorage.getItem(LS_KEY)); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function saveLogs(){ localStorage.setItem(LS_KEY, JSON.stringify(logs)); }
let logs = loadLogs();
let session = null; // {dayIndex, startedAt, entries:{exId:[{w,r}]}}

/* ============ HELPERS ============ */
const app = document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function unitLabel(ex){ return ex.unit==="seconds" ? "sec" : "reps" + (ex.unilateral==="side"?" per side":ex.unilateral==="leg"?" per leg":""); }
function targetText(item){ const ex=EX[item.id]; return item.sets+" x "+item.reps+" "+unitLabel(ex); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function setTab(name){
  document.getElementById("tab-program").classList.toggle("active", name==="program"||name==="log"||name==="guide");
  document.getElementById("tab-history").classList.toggle("active", name==="history");
  window.scrollTo(0,0);
}

/* ============ WEEKLY SUMMARY ============ */
function weeklyStats(){
  const weekAgo = Date.now() - 7*24*3600*1000;
  let volume=0, tut=0, count=0;
  for(const w of logs){
    if(w.startedAt < weekAgo) continue;
    count++;
    for(const en of w.entries){
      const ex = EX[en.exId]; if(!ex) continue;
      for(const s of en.sets){
        const v = parseFloat(s.r)||0; const wt = parseFloat(s.w)||0;
        if(ex.unit==="seconds"){ tut += v; }
        else { volume += wt * v * (ex.unilateral?2:1); }
      }
    }
  }
  return {volume:Math.round(volume), tut:Math.round(tut), count};
}

/* ============ VIEWS ============ */
function renderHome(){
  setTab("program");
  const st = weeklyStats();
  let h = '<div class="summary">'
    + '<div class="stat"><div class="v">'+st.volume+' kg</div><div class="l">Volume · 7 days</div></div>'
    + '<div class="stat"><div class="v">'+st.tut+'s</div><div class="l">Time under tension</div></div>'
    + '<div class="stat"><div class="v">'+st.count+'</div><div class="l">Workouts · 7 days</div></div>'
    + '</div>';
  DAYS.forEach((d,di)=>{
    h += '<div class="card"><h2>'+esc(d.name)+'</h2><p class="sub">'+esc(d.focus)+'</p>';
    d.items.forEach(it=>{
      const ex=EX[it.id];
      h += '<div class="exrow" data-guide="'+it.id+'"><div class="icon">'+ex.icon+'</div>'
        + '<div class="nm"><div class="t">'+esc(ex.name)+'</div><div class="s">'+targetText(it)+'</div></div>'
        + '<div class="go">›</div></div>';
    });
    h += '<div style="margin-top:10px"><button class="btn" data-start="'+di+'">Start '+esc(d.name.split(" — ")[0])+'</button></div></div>';
  });
  app.innerHTML = h;
  bindHome();
}
function bindHome(){
  app.querySelectorAll("[data-guide]").forEach(el=>{ el.addEventListener("click", ()=>renderGuide(el.getAttribute("data-guide"), "home")); });
  app.querySelectorAll("[data-start]").forEach(el=>{ el.addEventListener("click", e=>{ e.stopPropagation(); startDay(parseInt(el.getAttribute("data-start"),10)); }); });
}

function startDay(di){
  const d = DAYS[di];
  session = {dayIndex:di, startedAt:Date.now(), items:d.items, entries:{}};
  d.items.forEach(it=>{
    session.entries[it.id] = [];
    for(let i=0;i<it.sets;i++) session.entries[it.id].push({w:"", r:""});
  });
  renderLog();
}

function renderLog(){
  setTab("log");
  const d = DAYS[session.dayIndex];
  let h = '<span class="backlink" id="back-home">‹ Back (discards session)</span>';
  h += '<div class="card"><h2>'+esc(d.name)+'</h2><p class="sub">Log each set as you go. Tap the guide button for form help.</p></div>';
  d.items.forEach(it=>{
    const ex = EX[it.id];
    const sets = session.entries[it.id];
    h += '<div class="logex" data-ex="'+it.id+'"><div class="head"><div class="icon">'+ex.icon+'</div>'
      + '<div class="t">'+esc(ex.name)+'</div></div>'
      + '<p class="target">Target: '+targetText(it)+'</p>'
      + '<button class="guidebtn" data-guide="'+it.id+'">Form guide & video</button>'
      + '<div class="sets">';
    sets.forEach((s,si)=>{
      h += '<div class="setrow"><div class="n">Set '+(si+1)+'</div>'
        + '<input inputmode="decimal" placeholder="kg" value="'+esc(s.w)+'" data-w="'+it.id+':'+si+'" aria-label="Weight kg">'
        + '<div class="u">kg</div>'
        + '<input inputmode="numeric" placeholder="'+(ex.unit==="seconds"?"sec":"reps")+'" value="'+esc(s.r)+'" data-r="'+it.id+':'+si+'" aria-label="'+(ex.unit==="seconds"?"Seconds":"Reps")+'">'
        + '<div class="u">'+(ex.unit==="seconds"?"sec":"reps")+'</div>'
        + '<button class="x" data-delset="'+it.id+':'+si+'" aria-label="Remove set">×</button></div>';
    });
    h += '</div><button class="btn ghost small" data-addset="'+it.id+'">+ Add set</button></div>';
  });
  h += '<button class="btn" id="finish">Finish workout</button>';
  app.innerHTML = h;
  // wire inputs
  app.querySelectorAll("[data-w]").forEach(inp=>{ inp.addEventListener("input", ()=>{ const [id,si]=inp.getAttribute("data-w").split(":"); session.entries[id][+si].w=inp.value; }); });
  app.querySelectorAll("[data-r]").forEach(inp=>{ inp.addEventListener("input", ()=>{ const [id,si]=inp.getAttribute("data-r").split(":"); session.entries[id][+si].r=inp.value; }); });
  app.querySelectorAll("[data-delset]").forEach(b=>{ b.addEventListener("click", ()=>{ const [id,si]=b.getAttribute("data-delset").split(":"); session.entries[id].splice(+si,1); renderLog(); }); });
  app.querySelectorAll("[data-addset]").forEach(b=>{ b.addEventListener("click", ()=>{ session.entries[b.getAttribute("data-addset")].push({w:"",r:""}); renderLog(); }); });
  app.querySelectorAll("[data-guide]").forEach(b=>{ b.addEventListener("click", ()=>renderGuide(b.getAttribute("data-guide"), "log")); });
  document.getElementById("back-home").addEventListener("click", ()=>{ if(confirm("Discard this session?")){ session=null; renderHome(); } });
  document.getElementById("finish").addEventListener("click", finishWorkout);
}

function finishWorkout(){
  const d = DAYS[session.dayIndex];
  const entries = [];
  d.items.forEach(it=>{
    const done = session.entries[it.id].filter(s=>String(s.r).trim()!==""||String(s.w).trim()!=="");
    if(done.length) entries.push({exId:it.id, sets:done.map(s=>({w:String(s.w).trim(), r:String(s.r).trim()}))});
  });
  if(!entries.length){ alert("Log at least one set before finishing."); return; }
  logs.unshift({id:"w"+Date.now(), startedAt:session.startedAt, dayName:d.name, entries});
  saveLogs();
  session = null;
  renderHistory();
}

function renderGuide(exId, from){
  setTab("guide");
  const ex = EX[exId];
  const v = ex.video;
  const watchUrl = "https://www.youtube.com/watch?v="+v.id;
  const embedUrl = "https://www.youtube-nocookie.com/embed/"+v.id+"?rel=0";
  let h = '<span class="backlink" id="guide-back">‹ Back</span>';
  h += '<div class="card"><h2>'+esc(ex.name)+'</h2>';
  h += '<div class="video"><iframe src="'+embedUrl+'" title="'+esc(v.title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
  h += '<p class="attr">Video: “'+esc(v.title)+'” — '+esc(v.channel)+'. <a href="'+watchUrl+'" target="_blank" rel="noopener">Watch on YouTube</a></p>';
  h += '<div class="note">'+esc(ex.note)+'</div>';
  h += '<h3>Setup</h3><ol class="setup">'+ex.setup.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol>';
  h += '<p class="tempo">Tempo: '+esc(ex.tempo)+'</p>';
  h += '<h3>Dos and don\'ts</h3><div class="cols"><div class="do"><h4>Do</h4><ul>'+ex.dos.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul></div>'
     + '<div class="dont"><h4>Don\'t</h4><ul>'+ex.donts.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul></div></div>';
  h += '<h3>Common mistakes</h3><ul class="list">'+ex.mistakes.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul>';
  h += '<div class="tip"><strong>Tip:</strong> '+esc(ex.tip)+'</div>';
  h += '</div>';
  app.innerHTML = h;
  document.getElementById("guide-back").addEventListener("click", ()=>{
    if(from==="log" && session) renderLog();
    else if(from==="history") renderHistory();
    else renderHome();
  });
}

function renderHistory(){
  setTab("history");
  let h = '<div class="card"><h2>Workout history</h2><p class="sub">'+logs.length+' session'+(logs.length===1?"":"s")+' logged. Stored only in this browser.</p></div>';
  if(!logs.length){ h += '<div class="empty">No workouts logged yet.<br>Start a day from the Program tab.</div>'; }
  logs.forEach(w=>{
    h += '<div class="hist"><div class="hd"><div><div class="d">'+esc(w.dayName)+'</div><div class="w">'+fmtDate(w.startedAt)+'</div></div>'
      + '<button class="btn danger small" data-delw="'+w.id+'">Delete</button></div>';
    w.entries.forEach(en=>{
      const ex = EX[en.exId]; if(!ex) return;
      const parts = en.sets.map(s=>{
        const wv = s.w!==""? s.w+" kg × " : "";
        return wv + s.r + " " + unitLabel(ex);
      });
      h += '<div class="en"><strong>'+esc(ex.name)+':</strong> '+esc(parts.join(" · "))+'</div>';
    });
    h += '</div>';
  });
  app.innerHTML = h;
  app.querySelectorAll("[data-delw]").forEach(b=>{ b.addEventListener("click", ()=>{
    if(confirm("Delete this workout?")){ logs = logs.filter(w=>w.id!==b.getAttribute("data-delw")); saveLogs(); renderHistory(); }
  }); });
}

/* ============ NAV ============ */
document.getElementById("tab-program").addEventListener("click", ()=>{ renderHome(); });
document.getElementById("tab-history").addEventListener("click", ()=>{ renderHistory(); });
renderHome();
</script>
